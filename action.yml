name: Terraform Plan Review
description: Readable Terraform and OpenTofu plan reviews on pull requests, with source annotations, change tracking between pushes and policy rules. Linux runners only.
author: tf-contrib
branding:
  icon: git-pull-request
  color: purple

inputs:
  plan:
    description: >
      JSON plan(s) to review, one per line, inside the workspace: the output
      of `tofu show -json`, or reports written in `analyze` mode.
    required: true
  mode:
    description: >
      `comment` posts the review on the pull request. `analyze` writes a
      redacted report to `report` for combining roots from a job matrix.
    default: comment
  working-directory:
    description: Root module directory, used to resolve source locations.
    default: .
  name:
    description: "Display name of the root (default: working-directory)."
    default: ""
  report:
    description: Path of the report written in `analyze` mode, inside the workspace.
    default: terraform-plan-review.json
  config:
    description: "Rules file (default: .github/terraform-plan-review.hcl)."
    default: ""
  id:
    description: Comment identifier. Use different ids for independent comments on the same pull request.
    default: default
  title:
    description: Comment title.
    default: Plan
  annotate:
    description: Annotate changed resources on their source lines in the pull request diff.
    default: "true"
  summary:
    description: Write the full review to the job summary.
    default: "true"
  fail-on-block:
    description: Fail the step when a blocking rule matches and the override label is absent.
    default: "true"
  github-token:
    description: "Token used to post the comment. Needs `pull-requests: write`."
    default: ${{ github.token }}

outputs:
  has-changes:
    description: Whether any root has changes.
  destructive:
    description: Whether any resource will be destroyed or replaced.
  blocked:
    description: Whether a blocking rule matched without an override label.
  to-add:
    description: Number of resources to create.
  to-change:
    description: Number of resources to update in place.
  to-replace:
    description: Number of resources to replace.
  to-destroy:
    description: Number of resources to destroy.

runs:
  using: docker
  # A FROM scratch image holding the static binary. release-please updates
  # the tag on every release, so each ref runs the image it was released with.
  image: docker://ghcr.io/tf-contrib/terraform-plan-review:v0.2.1 # x-release-please-version
  args: [action]
  env:
    TERRAFORM_PLAN_REVIEW_MODE: ${{ inputs.mode }}
    TERRAFORM_PLAN_REVIEW_PLAN: ${{ inputs.plan }}
    TERRAFORM_PLAN_REVIEW_DIR: ${{ inputs.working-directory }}
    TERRAFORM_PLAN_REVIEW_NAME: ${{ inputs.name }}
    TERRAFORM_PLAN_REVIEW_OUT: ${{ inputs.report }}
    TERRAFORM_PLAN_REVIEW_CONFIG: ${{ inputs.config }}
    TERRAFORM_PLAN_REVIEW_ID: ${{ inputs.id }}
    TERRAFORM_PLAN_REVIEW_TITLE: ${{ inputs.title }}
    TERRAFORM_PLAN_REVIEW_ANNOTATE: ${{ inputs.annotate }}
    TERRAFORM_PLAN_REVIEW_SUMMARY: ${{ inputs.summary }}
    TERRAFORM_PLAN_REVIEW_FAIL_ON_BLOCK: ${{ inputs.fail-on-block }}
    GITHUB_TOKEN: ${{ inputs.github-token }}
